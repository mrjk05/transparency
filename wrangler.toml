name = "kadwood-transparency-engine"
compatibility_date = "2024-11-28"
compatibility_flags = ["nodejs_compat"]
main = "./build/index.js"

[vars]
SCOPES = "read_all_orders,read_customers,write_customers,read_orders,write_orders"
SHOPIFY_APP_URL = "https://kadwood-transparency-engine.jinskaduthodil.workers.dev"


[[d1_databases]]
binding = "DB"
database_name = "kadwood-db"
database_id = "9f04287a-eac4-4d4f-8b50-491891144de9" # Replace with actual ID

[[r2_buckets]]
binding = "R2"
bucket_name = "kadwood-reports"

# Shared with kadwood-ai-backend — SAME namespace id, deliberately. Studio's logout writes
# the revoked JWT here; this Worker reads it on every Studio-authenticated request. A private
# namespace would mean signing out of Studio left the passport wizard open for seven days.
[[kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "d0595d16631b4f00a72b3fc67abe6e52"

# Secrets (set via: npx wrangler secret put <NAME>)
# SHOPIFY_API_KEY       — embedded app client id
# SHOPIFY_API_SECRET    — signs the embedded app's session tokens
# JWT_SECRET            — MUST be byte-identical to kadwood-ai-backend's, or every Studio
#                         hand-off fails at /studio/enter
# STUDIO_ADMIN_SECRET   — must match Studio's TRANSPARENCY_ADMIN_SECRET
# SHOPIFY_ADMIN_TOKEN   — offline Admin API token; the only way to read orders when the
#                         caller arrived through Studio and has no id_token to exchange

[site]
bucket = "./public"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[build]
command = "npm run build"
