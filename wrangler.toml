name = "kadwood-transparency-engine"
compatibility_date = "2024-11-28"
compatibility_flags = ["nodejs_compat"]
main = "./build/index.js"

[vars]
SCOPES = "read_all_orders,read_customers,write_customers,read_orders,write_orders"
SHOPIFY_APP_URL = "https://kadwood-transparency-engine.jinskaduthodil.workers.dev"


[[d1_databases]]
binding = "DB"
database_name = "kadwood-db"
database_id = "9f04287a-eac4-4d4f-8b50-491891144de9" # Replace with actual ID

[[r2_buckets]]
binding = "R2"
bucket_name = "kadwood-reports"

# Shared with kadwood-ai-backend — SAME namespace id, deliberately. It carries two things:
# Studio's revoked JWTs (read on every Studio-authenticated request, so that signing out of
# Studio does not leave the passport wizard open for seven days) and the single-use
# `studio_ticket:<opaque>` hand-off entries Studio mints for /studio/enter.
#
# Note what else lives in this namespace on Studio's side: live `otp:<email>` sign-in codes
# and WebAuthn challenges. KV bindings are read/write with no read-only mode, so this Worker
# can reach them. Both lookups here are therefore constrained — the blacklist is only read
# after a signature check, and ticket names are restricted to a fixed character class — so
# neither can be pointed at a key it was not meant to see. Giving revocation its own
# namespace is the better long-term fix and is recorded in the plan's open risks.
[[kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "d0595d16631b4f00a72b3fc67abe6e52"

# Secrets (set via: npx wrangler secret put <NAME>)
# SHOPIFY_API_KEY       — embedded app client id
# SHOPIFY_API_SECRET    — signs the embedded app's session tokens
# JWT_SECRET            — MUST be byte-identical to kadwood-ai-backend's, or every Studio
#                         hand-off fails at /studio/enter
# STUDIO_ADMIN_SECRET   — must match Studio's TRANSPARENCY_ADMIN_SECRET
# SHOPIFY_ADMIN_TOKEN   — offline Admin API token; the only way to read orders when the
#                         caller arrived through Studio and has no id_token to exchange

[site]
bucket = "./public"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[build]
command = "npm run build"
